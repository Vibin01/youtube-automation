name: AutoTube AI - Autonomous YouTube Publishing

on:
  schedule:
    # 10:15 AM IST (04:45 UTC) - Morning Slot (Weekly 5-6 min Story on Sun, 30s Short Mon-Sat)
    - cron: '45 4 * * *'
    # 4:30 PM IST (11:00 UTC) - Evening Slot (Daily 30s Dance Short)
    - cron: '0 11 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Publishing Mode'
        required: true
        default: 'auto'
        type: choice
        options:
          - 'auto'
          - 'full_story'
          - 'short'

jobs:
  publish-video:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 🐍 Setup Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install FFmpeg, Edge-TTS, and Tamil Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-lohit-taml fonts-freefont-ttf fonts-dejavu-core
          pip install edge-tts

      - name: 📦 Install Project Dependencies
        run: npm ci

      - name: 🗄️ Initialize SQLite Database
        env:
          DATABASE_URL: "file:./dev.db"
        run: npx prisma db push

      - name: 🚀 Run Autonomous YouTube Publisher
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL || 'gemini-2.5-flash' }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REDIRECT_URI: "http://localhost:3000/api/youtube/callback"
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID || 'UCuMrJMyuch2dn4ldJejdiVQ' }}
          YOUTUBE_CHANNEL_TITLE: "Happy Kuttu Song"
          DATABASE_URL: "file:./dev.db"
          OUTPUT_DIR: "./output"
        run: |
          if [ "${{ github.event.inputs.mode }}" = "full_story" ]; then
            npm run worker:daily:full
          elif [ "${{ github.event.inputs.mode }}" = "short" ]; then
            npm run worker:daily:short
          else
            npm run worker:daily:now
          fi
